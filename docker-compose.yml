services:
  postgres:
    image: postgres:16-alpine
    container_name: university-ai-postgres
    environment:
      POSTGRES_USER: university_ai
      POSTGRES_PASSWORD: university_ai_dev
      POSTGRES_DB: university_ai
    ports:
      - "127.0.0.1:5433:5432"   # local machine only (development password)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university_ai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: university-ai-redis
    ports:
      - "127.0.0.1:6379:6379"   # local machine only (no Redis password in development)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: university-ai-chromadb
    ports:
      - "127.0.0.1:8000:8000"   # local machine only (Chroma server API has unauthenticated CVEs)
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"

volumes:
  postgres_data:
  redis_data:
  chroma_data:
